services:
  # 1. AI Service (Python FastAPI)
  - type: web
    name: pataai-ai-service
    env: python
    repo: https://github.com/gowtham786786/pata_ai.git
    branch: main
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Node.js Gateway Backend
  - type: web
    name: pataai-node-backend
    env: node
    repo: https://github.com/gowtham786786/pata_ai.git
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: pataai-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FIREBASE_PROJECT_ID
        value: pataai
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@pataai.iam.gserviceaccount.com
      - key: FIREBASE_PRIVATE_KEY
        sync: false # You MUST add this secret manually in the Render Dashboard!
